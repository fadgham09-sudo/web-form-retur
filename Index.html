<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Retur UT Daerah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PORTAL WRAPPER -->
  <main class="portal-container">
    
    <!-- LEFT PANEL -->
    <section class="left-panel">
      <div class="brand">Universitas Terbuka</div>
      <h1 class="headline">Konfirmasi Retur Daerah</h1>
      <p class="description">Silakan masukkan nomor pesanan Anda untuk memverifikasi data Paket Retur di UT Daerah</p>
      
      <div class="info-card">
        <strong>Informasi:</strong> Pastikan Nomor Pemesanan yang dimasukkan sesuai dengan yang tertera di paket
      </div>
      
      <div class="step-indicator">
        <span class="step active" id="step-1">1. Cek Nomor</span>
        <span class="step" id="step-2">2. Isi Identitas</span>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="right-panel">
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Logo_Universitas_Terbuka.svg" alt="Logo UT" width="80">
      </div>
      
      <!-- CONTENT CARD -->
      <div class="content-card">
        <div class="header">
          <h2>Formulir Validasi</h2>
        </div>
        
        <!-- Alert Box -->
        <div class="alert hidden" id="alert-box"></div>
        
        <!-- Form -->
        <form id="main-form">
          <input type="hidden" name="action" id="input-action" value="cek">
          
          <div class="form-group">
            <label for="nomor_pemesanan">Nomor Pemesanan</label>
            <input type="text" id="nomor_pemesanan" name="nomor_pemesanan" placeholder="Contoh: PO12345" required>
          </div>

          <!-- Form Identitas (Hidden by default) -->
          <div id="identitas-section" class="hidden">
            <div class="form-group">
              <label for="nim">NIM</label>
              <input type="number" id="nim" name="nim" placeholder="Masukkan NIM Anda">
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap">
            </div>
            <div class="form-group">
              <label for="nama_upbjj">Nama UPBJJ</label>
              <input type="text" id="nama_upbjj" name="nama_upbjj" placeholder="Contoh: Jakarta">
            </div>
          </div>
          
          <button type="submit" id="submit-btn" class="btn-primary">Cek Nomor Pemesanan</button>
        </form>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
