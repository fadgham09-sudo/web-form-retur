<!DOCTYPE html>
<html lang="id">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Retur UT Daerah</title>
  
  <!--Pemanggilan font rapih-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
  
<body>
  <!-- PORTAL WRAPPER -->
  <main class="portal-container">
    
    <!-- LEFT PANEL -->
    <section class="left-panel">
      <div class="brand">Pusat Distribusi Bahan Ajar</div>
      <h1 class="headline">Pendataan Paket Retur UT Daerah</h1>
      <p class="description">Masukkan Nomor Pemesanan Untuk Verifikasi Data Paket Retur</p>
      <div class="info-card">
        <strong>Informasi:</strong> Pastikan Nomor Pemesanan Sesuai Dengan Identitas Paket
      </div>
      <div class="step-indicator">
        <span class="step active" id="step-1">Cek Nomor</span>
        <span class="step" id="step-2">Isi Identitas</span>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="right-panel">
      <div class="logo">
        <img src="logo warna UT.png" alt="logo UT" width="80">
      </div>
      
      <!-- CONTENT CARD -->
      <div class="content-card">
        <div class="header">
          <h2>Formulir Validasi</h2>
        </div>
        
        <!-- Alert Box -->
        <div class="alert hidden" id="alert-box"></div>
        
        <!-- Form -->
        <form id="main-form">
          <input type="hidden" name="action" id="input-action" value="cek">
          
          <div class="form-group">
            <label for="nomor_pemesanan">Nomor Pemesanan</label>
            <input type="text" id="nomor_pemesanan" name="nomor_pemesanan" placeholder="Masukkan 20 digit angka" minlength="20" maxlength="20" pattern="\d{20}" title="Nomor harus terdiri dari tepat 20 digit angka" required>
          </div>

          <!-- Form Identitas (Hidden by default) -->
          <div id="identitas-section" class="hidden">
            <div class="form-group">
              <label for="nim">NIM</label>
              <input type="number" id="nim" name="nim" placeholder="Masukkan NIM Paket Retur">
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap</label>
              <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap">
            </div>
            <div class="form-group">
              <label for="nama_upbjj">Nama UPBJJ</label>
              <input type="text" id="nama_upbjj" name="nama_upbjj" placeholder="Contoh: Jakarta">
            </div>
          </div>
          
          <button type="submit" id="submit-btn" class="btn-primary">Cek Nomor Pemesanan</button>
        </form>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
